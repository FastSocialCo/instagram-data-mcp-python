[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "instagram-data-mcp"
version = "0.1.7"
description = "Local MCP server for the FastSocial Instagram data API: public profiles, posts, reels, stories and comments."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["mcp>=2.2", "httpx>=0.27", "anyio>=4"]
keywords = ["mcp", "instagram", "model-context-protocol", "instagram-api", "instagram-data-api", "claude", "ai-agents"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Internet :: WWW/HTTP",
  "Intended Audience :: Developers",
]

[project.urls]
Homepage = "https://fastsocial.co/instagram-api?ref=pypi"
Documentation = "https://fastsocial.co/instagram-api/docs?ref=pypi"
Repository = "https://github.com/FastSocialCo/instagram-data-mcp-python"

[project.scripts]
instagram-data-mcp = "instagram_data_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/instagram_data_mcp"]
